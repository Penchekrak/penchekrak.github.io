<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta
      name="description"
      content="First-person WebGL exploration of the RoboGSmart native-v2 kitchen Gaussian splat."
    />
    <title>Kitchen 001 / Gaussian FPV</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewer" aria-label="Kitchen Gaussian splat viewer">
      <header class="scene-id">
        <p>ROBOGSMART / NATIVE V2</p>
        <h1>Kitchen 001</h1>
      </header>

      <div class="scene-meta" aria-label="Scene metadata">
        <span>GS</span>
        <strong>277K</strong>
      </div>

      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true"></div>
        <div class="loading-copy">
          <strong id="loading-label">Loading scene</strong>
          <span id="loading-value">0%</span>
        </div>
        <div class="loading-track" aria-hidden="true">
          <span id="loading-progress"></span>
        </div>
      </div>

      <button id="enter" class="enter" type="button" hidden>
        <span class="enter-icon" aria-hidden="true"></span>
        <span>Enter FPV</span>
      </button>

      <div id="reticle" class="reticle" aria-hidden="true"></div>

      <div id="joystick" class="joystick" aria-label="Move" hidden>
        <div class="joystick-ring">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>

      <div id="altitude" class="altitude" hidden>
        <button id="rise" type="button" aria-label="Fly up" title="Fly up">
          <span aria-hidden="true">&#8593;</span>
        </button>
        <button
          id="descend"
          type="button"
          aria-label="Fly down"
          title="Fly down"
        >
          <span aria-hidden="true">&#8595;</span>
        </button>
      </div>

      <div class="telemetry" aria-live="off">
        <span id="lock-state">IDLE</span>
        <span class="telemetry-divider"></span>
        <span id="fps">-- FPS</span>
      </div>

      <a
        class="engine"
        href="https://github.com/sparkjsdev/spark"
        target="_blank"
        rel="noreferrer"
      >
        SPARK 2.1 / MIT
      </a>

      <div id="error" class="error" role="alert" hidden>
        <strong>Scene unavailable</strong>
        <button id="retry" type="button">Retry</button>
      </div>
    </main>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
